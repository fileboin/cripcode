[package]
name = "ship-studio"
version = "0.18.11"
description = "Cripcode — a desktop app for shipping web projects with AI coding agents."
authors = ["Julian Galluzzo", "Cripcode contributors"]
license = "MIT"
repository = "https://github.com/fileboin/cripcode"
homepage = "https://github.com/fileboin/cripcode"
edition = "2021"
default-run = "ship-studio"

# Pattern enforcement lints — see also src-tauri/clippy.toml for disallowed-methods.
# unwrap/expect are WARN (not deny) because the existing codebase has many sites
# that would block CI immediately. Per-module migration raises these to deny as
# sites are paid down.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "ship_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production backend for the standalone CripCode Template API binary
# (PostgreSQL metadata). Optional so the desktop app build never links sqlx.
# Build with: cargo build --bin cripcode-template-api --features template-postgres
template-postgres = ["dep:sqlx"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-pty = { path = "plugins/tauri-plugin-pty" }
portable-pty = { version = "0.9.0", features = ["serde_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "io-util", "net", "fs"] }
dirs = "5"
which = "6"
base64 = "0.22"
url = "2"
tauri-plugin-fs = "2"
# jpeg/gif/webp: custom thumbnail uploads decode whatever the user drags in
# (saved back out as PNG); png-only rejected every JPEG upload (issue #561).
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2"
semver = "1"
tracing = "0.1"
# SSH password auth: passwords live in the OS keystore (Windows Credential
# Manager / macOS Keychain / Secret Service), never in the servers JSON file.
# keyring v3 enables NO platform store by default — windows-native is
# REQUIRED, otherwise set/get silently hit the in-memory mock store.
keyring = { version = "3", features = ["windows-native"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.34"
once_cell = "1.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
ignore = "0.4"
libc = "0.2.180"
dunce = "1"
urlencoding = "2"
hyper = { version = "1", features = ["http1", "server", "client"] }
# Android mirror bridge: WebSocket server streaming screenrecord H.264 to the webview.
tokio-tungstenite = "0.24"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# PostgreSQL metadata repository for the standalone Template API binary.
# Optional (see the `template-postgres` feature) — the desktop app never
# links it. No `macros` feature: the schema is applied via raw_sql.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-screenshots = "2.2.0"
arboard = "3"

# macOS-specific dependencies for WebKit JavaScript evaluation
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry"] }
block2 = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
# Android SSH transport: no OpenSSH binary exists on Android, so remote
# sessions use this in-process client behind the SessionBackend seam.
# `ring` (not aws-lc-rs) keeps the NDK build toolchain-free; `rsa` covers
# RSA host keys / keys, `flate2` covers zlib compression.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
# Android in-app update: JNI access to the package installer + FileProvider
# content URI handoff (see commands/android_update.rs).
jni = "0.21"
ndk-context = "0.1"
